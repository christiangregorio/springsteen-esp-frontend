<div class="top-banner">
  <img src="images/wrh.jpg" alt="Banner de Bruce Springsteen" class="banner-image">
</div>
  
<div class="login-container">
  <h2>Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!-- Campo Email -->
    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email" 
        placeholder="usuario@correo.com"
        required
      />
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
        Email inválido
      </div>
    </div>

    <!-- Campo Contraseña -->
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="********"
        required
      />
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error">
        La contraseña es obligatoria
      </div>
    </div>

    <!-- Botón -->
    <button type="submit" [disabled]="!form.valid">Iniciar sesión</button>
  </form>

  <!-- Enlace de registro -->
  <div class="register-link">
    ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
  </div>
</div>

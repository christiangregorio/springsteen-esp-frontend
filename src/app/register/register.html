<div class="login-container">
  <h2>Registrarse</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!-- Nombre de usuario -->
    <div class="form-group">
      <label for="username">Nombre de usuario:</label>
      <input id="username" type="text" formControlName="username" placeholder="Tu nombre de usuario"/>
      <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="error">
        Nombre de usuario requerido
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email" placeholder="usuario@correo.com"/>
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
        Email inválido
      </div>
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input id="password" type="password" formControlName="password" placeholder="********"/>
    </div>

    <!-- Repetir contraseña -->
    <div class="form-group">
      <label for="confirmPassword">Repetir contraseña:</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="********"/>
      <div *ngIf="form.value.password !== form.value.confirmPassword && form.get('confirmPassword')?.touched" class="error">
        Las contraseñas no coinciden
      </div>
    </div>

    <!-- Botón de submit -->
    <button type="submit" [disabled]="!form.valid">Registrarse</button>
  </form>

  <!-- Botón Volver -->
  <div style="margin-top: 1rem; text-align: center;">
    <button type="button" (click)="goBack()">Volver</button>
  </div>
</div>
